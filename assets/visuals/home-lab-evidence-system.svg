<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Verified Home Lab evidence system</title>
  <desc id="desc">A branded systems diagram showing Proxmox and pfSense connected to a core network, Windows Server domain services, a Windows client, Ubuntu on VLAN 30, backup operations, isolated restore testing, and operational documentation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07101f"/>
      <stop offset="0.52" stop-color="#0f1b31"/>
      <stop offset="1" stop-color="#11152f"/>
    </linearGradient>
    <linearGradient id="cyanMagenta" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#d946ef"/>
    </linearGradient>
    <linearGradient id="nodeFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#18253d"/>
      <stop offset="1" stop-color="#0b1426"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#94a3b8" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <marker id="arrowCyan" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L10 5L0 10Z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowMagenta" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L10 5L0 10Z" fill="#d946ef"/>
    </marker>
    <style>
      .label{font:700 18px 'Segoe UI',Arial,sans-serif;fill:#f8fafc}
      .meta{font:600 13px 'Segoe UI',Arial,sans-serif;fill:#9fb0c6;letter-spacing:.02em}
      .micro{font:800 11px 'Cascadia Mono',Consolas,monospace;fill:#38bdf8;letter-spacing:.14em}
      .micro-magenta{font:800 11px 'Cascadia Mono',Consolas,monospace;fill:#d946ef;letter-spacing:.14em}
      .node{fill:url(#nodeFill);stroke:#334155;stroke-width:1.4}
      .node-cyan{fill:url(#nodeFill);stroke:#38bdf8;stroke-opacity:.72;stroke-width:1.6}
      .node-magenta{fill:url(#nodeFill);stroke:#d946ef;stroke-opacity:.68;stroke-width:1.6}
      .node-green{fill:url(#nodeFill);stroke:#34d399;stroke-opacity:.72;stroke-width:1.6}
      .line-cyan{fill:none;stroke:#38bdf8;stroke-width:2;stroke-opacity:.72;marker-end:url(#arrowCyan)}
      .line-magenta{fill:none;stroke:#d946ef;stroke-width:2;stroke-opacity:.64;marker-end:url(#arrowMagenta)}
      .line-soft{fill:none;stroke:#64748b;stroke-width:1.3;stroke-opacity:.48;stroke-dasharray:5 6}
      .chip{fill:#0b1426;stroke:#334155;stroke-width:1}
      .icon{fill:none;stroke:#e2e8f0;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>

  <rect width="1200" height="720" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="720" rx="28" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="718" rx="27" fill="none" stroke="url(#cyanMagenta)" stroke-opacity="0.72" stroke-width="2"/>

  <g transform="translate(42 34)">
    <text class="micro">VERIFIED HOME LAB EVIDENCE SYSTEM</text>
    <text x="0" y="34" class="label" font-size="30">Infrastructure, validation, and preserved proof</text>
    <text x="1110" y="12" class="micro-magenta" text-anchor="end">PERSONAL LAB</text>
    <text x="1110" y="34" class="meta" text-anchor="end">Scope and limitations remain visible</text>
  </g>

  <g transform="translate(46 108)">
    <rect class="node-cyan" x="402" y="0" width="298" height="92" rx="18"/>
    <text x="426" y="28" class="micro">VIRTUALIZATION LAYER</text>
    <text x="426" y="56" class="label">Proxmox VE</text>
    <text x="426" y="78" class="meta">VM inventory · storage · backup coverage</text>
    <g transform="translate(650 22)" filter="url(#glow)">
      <rect x="0" y="0" width="24" height="16" rx="3" class="icon"/>
      <rect x="0" y="24" width="24" height="16" rx="3" class="icon"/>
      <path d="M6 8h12M6 32h12" class="icon"/>
    </g>

    <rect class="node-magenta" x="0" y="148" width="244" height="112" rx="18"/>
    <text x="22" y="176" class="micro-magenta">EDGE &amp; ROUTING</text>
    <text x="22" y="206" class="label">pfSense</text>
    <text x="22" y="230" class="meta">Firewall · routing · segmentation</text>
    <text x="22" y="250" class="meta">Core network and VLAN path</text>
    <g transform="translate(190 174)">
      <path d="M8 24h36M26 6v36M10 10l32 32M42 10L10 42" class="icon"/>
    </g>

    <rect class="node-cyan" x="318" y="132" width="468" height="144" rx="22"/>
    <text x="342" y="160" class="micro">CORE SERVICES</text>
    <text x="342" y="191" class="label">DC01 · Windows Server</text>
    <text x="342" y="216" class="meta">Active Directory Domain Services</text>
    <text x="342" y="238" class="meta">DNS · DHCP · Group Policy</text>
    <g transform="translate(708 160)">
      <rect x="0" y="0" width="44" height="58" rx="6" class="icon"/>
      <path d="M9 12h26M9 24h26M9 36h18M9 48h12" class="icon"/>
    </g>

    <rect class="node" x="860" y="116" width="246" height="116" rx="18"/>
    <text x="882" y="144" class="micro">WINDOWS ENDPOINT</text>
    <text x="882" y="174" class="label">WS01</text>
    <text x="882" y="198" class="meta">Domain membership</text>
    <text x="882" y="216" class="meta">Client validation</text>
    <g transform="translate(1040 145)">
      <rect x="0" y="0" width="42" height="28" rx="4" class="icon"/>
      <path d="M8 38h26M21 28v10" class="icon"/>
    </g>

    <rect class="node-green" x="860" y="250" width="246" height="112" rx="18"/>
    <text x="882" y="278" class="micro" fill="#34d399">LINUX VLAN</text>
    <text x="882" y="308" class="label">Linux01 · Ubuntu</text>
    <text x="882" y="332" class="meta">VLAN 30 · service checks</text>
    <text x="882" y="350" class="meta">Domain integration checks</text>
    <g transform="translate(1048 280)">
      <circle cx="17" cy="17" r="15" class="icon"/>
      <path d="M10 19c4 5 10 5 14 0M11 12h1M22 12h1" class="icon"/>
    </g>

    <rect class="node-magenta" x="286" y="326" width="246" height="132" rx="18"/>
    <text x="308" y="354" class="micro-magenta">BACKUP OPERATIONS</text>
    <text x="308" y="384" class="label">Scheduled</text>
    <text x="308" y="405" class="label">backups</text>
    <text x="308" y="431" class="meta">Critical VM coverage</text>
    <text x="308" y="449" class="meta">Retained copies</text>
    <g transform="translate(482 374)">
      <ellipse cx="18" cy="8" rx="16" ry="7" class="icon"/>
      <path d="M2 8v22c0 4 7 7 16 7s16-3 16-7V8M2 19c0 4 7 7 16 7s16-3 16-7" class="icon"/>
    </g>

    <rect class="node-green" x="566" y="326" width="246" height="132" rx="18"/>
    <text x="588" y="354" class="micro" fill="#34d399">RESTORE VALIDATION</text>
    <text x="588" y="384" class="label">Isolated restore</text>
    <text x="588" y="405" class="label">test</text>
    <text x="588" y="431" class="meta">Boot · guest response</text>
    <text x="588" y="449" class="meta">Cleanup</text>
    <g transform="translate(758 374)">
      <path d="M5 20a16 16 0 1 0 6-12M5 4v16h16" class="icon"/>
      <path d="M13 20l6 6 11-14" class="icon"/>
    </g>

    <rect class="node-cyan" x="0" y="326" width="252" height="132" rx="18"/>
    <text x="22" y="354" class="micro">EVIDENCE RECORDS</text>
    <text x="22" y="384" class="label">Operational</text>
    <text x="22" y="405" class="label">documentation</text>
    <text x="22" y="431" class="meta">Inventories · runbooks</text>
    <text x="22" y="449" class="meta">Validation output</text>
    <g transform="translate(204 374)">
      <path d="M4 2h28l10 10v38H4zM32 2v12h10M11 24h22M11 34h22M11 44h14" class="icon"/>
    </g>

    <path d="M551 92V116" class="line-cyan"/>
    <path d="M318 204H252" class="line-magenta"/>
    <path d="M786 184H848" class="line-cyan"/>
    <path d="M786 222C824 222 828 300 848 300" class="line-cyan"/>
    <path d="M428 276V318" class="line-magenta"/>
    <path d="M532 390H554" class="line-cyan"/>
    <path d="M252 390H274" class="line-cyan"/>
    <path d="M700 92C740 104 804 112 860 140" class="line-soft"/>
    <path d="M700 92C790 124 818 244 860 286" class="line-soft"/>

    <g transform="translate(0 492)">
      <rect class="chip" x="0" y="0" width="248" height="54" rx="14"/>
      <rect class="chip" x="266" y="0" width="248" height="54" rx="14"/>
      <rect class="chip" x="532" y="0" width="248" height="54" rx="14"/>
      <rect class="chip" x="798" y="0" width="308" height="54" rx="14"/>
      <text x="24" y="22" class="micro">01 · CONFIGURE</text><text x="24" y="41" class="meta">Systems and access paths</text>
      <text x="290" y="22" class="micro-magenta">02 · VALIDATE</text><text x="290" y="41" class="meta">Service state and behavior</text>
      <text x="556" y="22" class="micro">03 · CAPTURE</text><text x="556" y="41" class="meta">Outputs, inventories, results</text>
      <text x="822" y="22" class="micro-magenta">04 · PRESERVE</text><text x="822" y="41" class="meta">Artifacts, scope, and limitations</text>
    </g>
  </g>
</svg>
