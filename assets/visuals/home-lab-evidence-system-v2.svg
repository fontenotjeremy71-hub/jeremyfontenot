    <text x="340" y="158" fill="#f8fafc" font-size="19" font-weight="700">Microsoft Azure · Azure Arc</text>
    <text x="340" y="178" fill="#94a3b8" font-size="12">Azure for Students · Central US · rg-hybrid-lab-centralus-01</text>
    <text x="760" y="178" fill="#94a3b8" font-size="12">Arc-enabled Servers · inventory · tags · resource context</text>

    <!-- Windows administration -->
