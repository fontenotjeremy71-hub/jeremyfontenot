<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Verified Home Lab evidence system with Azure Arc, Windows Admin Center, Proxmox, SCVMM, and nested Hyper-V</title>
  <desc id="desc">A branded systems diagram showing Microsoft Azure and Azure Arc as the hybrid cloud control plane above the on-premises home lab; Windows Admin Center for remote Windows administration; Proxmox VE hosting core workloads; System Center Virtual Machine Manager 2022 centrally managing nested Hyper-V host HVHOST01; APP01 storage validation; backups; restore testing; and preserved operational evidence.</desc>
  <rect width="1200" height="900" rx="28" fill="#07101f"/>
  <g font-family="Segoe UI,Arial,sans-serif">
