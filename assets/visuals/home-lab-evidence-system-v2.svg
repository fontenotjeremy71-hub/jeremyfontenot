irewall · routing</text><text x="64" y="318" fill="#94a3b8" font-size="12">Segmentation</text><rect x="316" y="212" width="350" height="122" rx="20" fill="#111827" stroke="#38bdf8"/><text x="340" y="240" fill="#38bdf8" font-size="11" font-weight="700">CORE SERVICES</text><text x="340" y="270" fill="#f8fafc" font-size="19" font-weight="700">DC01 · Windows Server</text><text x="340" y="296" fill="#94a3b8" font-size="12">AD DS · DNS · DHCP</text><text x="340" y="316" fill="#94a3b8" font-size="12">Group Policy</text><rect x="710" y="210" width="218" height="122" rx="20" fill="#111827" stroke="#f59e0b"/><text x="734" y="238" fill="#f59e0b" font-size="11" font-weight="700">NESTED HYPER-V HOST</text><text x="734" y="268" fill="#f8fafc" font-size="19" font-weight="700">HVHOST01</text><text x="734" y="294" fill="#94a3b8" font-size="12">Hyper-V role</text><text x="734" y="314" fill="#94a3b8" font-size="12">VM lifecycle</text><rect x="954" y="210" width="204" height="122" rx="20" fill="#111827" stroke="#f59e0b"/><text x="976" y="238" fill="#f59e0b" font-size="11" font-weight="700">HYPER-V GUEST</text><text x="976" y="268" fill="#f8fafc" font-size="19" font-weight="700">APP01</text><text x="976" y="292" fill="#94a3b8" font-size="12">Windows Server 2022</text><text x="976" y="312" fill="#94a3b8" font-size="12">100 GB VHDX · Data (D:)</text><rect x="42" y="370" width="230" height="100" rx="16" fill="#111827" stroke="#475569"/><text x="64" y="396" fill="#38bdf8" font-size="11" font-weight="700">WINDOWS ENDPOINT</text><text x="64" y="425" fill="#f8fafc" font-size="18" font-weight="700">WS01</text><text x="64" y="448" fill="#94a3b8" font-size="12">Domain member</text><text x="64" y="464" fill="#94a3b8" font-size="12">Client validation</text><rect x="292" y="370" width="230" height="100" rx="16" fill="#111827" stroke="#d946ef"/><text x="314" y="396" fill="#d946ef" font-size="11" font-weight="700">MACOS ENDPOINT</text><text x="314" y="425" fill="#f8fafc" font-size="18" font-weight="70