    <text x="64" y="248" fill="#38bdf8" font-size="11" font-weight="700">WINDOWS ADMINISTRATION</text>
    <text x="64" y="274" fill="#f8fafc" font-size="17" font-weight="700">Windows Admin Center</text>
    <text x="64" y="294" fill="#94a3b8" font-size="11">Remote management · WinRM</text>
    <text x="64" y="302" fill="#64748b" font-size="9">DC01 · HVHOST01 · APP01 · WS01</text>

    <!-- Virtualization and management -->
    <rect x="316" y="224" width="350" height="82" rx="18" fill="#111827" stroke="#38bdf8"/>
    <text x="340" y="252" fill="#38bdf8" font-size="11" font-weight="700">PRIMARY VIRTUALIZATION LAYER</text>
    <text x="340" y="278" fill="#f8fafc" font-size="19" font-weight="700">Proxmox VE</text>
    <text x="340" y="298" fill="#94a3b8" font-size="12">VM inventory · storage · bridges · backup coverage</text>

    <rect x="710" y="224" width="448" height="82" rx="18" fill="#111827" stroke="#a78bfa"/>
