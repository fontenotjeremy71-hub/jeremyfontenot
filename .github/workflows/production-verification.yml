name: Production Portfolio Verification
on:
  workflow_dispatch:
  schedule:
    - cron: '17 11 * * *'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check 15 live Jekyll case studies, canonical sitemap and immutable evidence
        run: python jekyll-pilot/tools/verify_live.py --attempts 2
