name: Diagnostic validation

on:
  push:
    branches:
      - feat/macos-home-lab-evidence
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Capture publication validation
        id: validation
        shell: bash
        run: |
          set +e
          mkdir -p artifacts/validation
          npm run check:publication 2>&1 | tee artifacts/validation/publication.log
          code=${PIPESTATUS[0]}
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: publication-diagnostics
          path: artifacts/validation/publication.log
          if-no-files-found: error
          retention-days: 14
      - name: Fail on validation error
        if: steps.validation.outputs.code != '0'
        run: exit 1
