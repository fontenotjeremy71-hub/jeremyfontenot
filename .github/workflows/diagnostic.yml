name: Diagnostic validation

on:
  push:
    branches:
      - feat/macos-home-lab-evidence
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/macos-home-lab-evidence
          fetch-depth: 0
      - name: Update Microsoft 365 generated-output exclusions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('content/microsoft-365/source-manifest.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          value = 'evidence/index.html'
          roots = data['generatedOutputRoots']
          if value not in roots:
              roots.append(value)
          path.write_text(json.dumps(data, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Commit manifest correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- content/microsoft-365/source-manifest.json
          if git diff --cached --quiet; then
            echo "No manifest change required."
            exit 0
          fi
          git commit -m "fix: exclude generated foundation evidence route from M365 discovery"
          git push origin HEAD:feat/macos-home-lab-evidence
