name: Diagnostic validation

on:
  push:
    branches:
      - feat/macos-home-lab-evidence
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/macos-home-lab-evidence
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Generate skill-map outputs
        run: npm run build:skill-map
      - name: Commit generated skill-map outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            assets/data/evidence-skill-map.json \
            systems-skills/evidence-map.html \
            evidence/claim-map.html \
            content/site/generated-skill-map-hashes.json
          if git diff --cached --quiet; then
            echo "No skill-map output changes."
            exit 0
          fi
          git commit -m "build: refresh MACVM01 skill-map outputs"
          git push origin HEAD:feat/macos-home-lab-evidence
