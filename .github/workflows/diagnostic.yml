name: Diagnostic validation

on:
  push:
    branches:
      - feat/macos-home-lab-evidence
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/macos-home-lab-evidence
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Generate foundation pages
        shell: bash
        run: |
          set -euo pipefail
          npm run build:foundation
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const files = [
            'evidence/index.html',
            'home-lab/index.html',
            'microsoft-365/index.html',
            'systems-skills/index.html'
          ];
          const hashes = {};
          for (const file of files) {
            hashes[file] = crypto.createHash('sha256').update(fs.readFileSync(file, 'utf8'), 'utf8').digest('hex');
          }
          fs.writeFileSync('content/site/generated-foundation-hashes.json', JSON.stringify({schemaVersion: 1, files: hashes}, null, 2) + '\n', 'utf8');
          NODE
      - name: Commit foundation outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            evidence/index.html \
            home-lab/index.html \
            microsoft-365/index.html \
            systems-skills/index.html \
            content/site/generated-foundation-hashes.json
          if git diff --cached --quiet; then
            echo "No foundation output changes."
            exit 0
          fi
          git commit -m "build: refresh MACVM01 foundation outputs"
          git push origin HEAD:feat/macos-home-lab-evidence
