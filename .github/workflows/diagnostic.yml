name: Diagnostic validation

on:
  push:
    branches:
      - feat/macos-home-lab-evidence
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Capture foundation validation
        id: validation
        shell: bash
        run: |
          set +e
          mkdir -p artifacts/validation
          npm run build:foundation 2>&1 | tee artifacts/validation/build-foundation.log
          build_code=${PIPESTATUS[0]}
          npm run validate:foundation 2>&1 | tee artifacts/validation/validate-foundation.log
          validate_code=${PIPESTATUS[0]}
          echo "build_code=$build_code" >> "$GITHUB_OUTPUT"
          echo "validate_code=$validate_code" >> "$GITHUB_OUTPUT"
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: current-foundation-diagnostics
          path: artifacts/validation
          if-no-files-found: error
          retention-days: 14
      - name: Fail on validation error
        if: steps.validation.outputs.build_code != '0' || steps.validation.outputs.validate_code != '0'
        run: exit 1
