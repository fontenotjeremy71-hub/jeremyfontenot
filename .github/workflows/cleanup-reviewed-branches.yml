name: Cleanup reviewed branches

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove temporary operations branch
        shell: bash
        run: |
          set -euo pipefail
          git push origin --delete 'ops/cleanup-reviewed-branches'
