name: Cleanup merged branches

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete only branches fully merged into main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --all --prune
          deleted=0
          preserved=0
          while IFS= read -r branch; do
            branch="${branch#origin/}"
            case "$branch" in
              main|HEAD) continue ;;
            esac

            if git merge-base --is-ancestor "origin/$branch" origin/main; then
              echo "Deleting merged branch: $branch"
              git push origin --delete "$branch"
              deleted=$((deleted + 1))
            else
              echo "Preserving unmerged branch: $branch"
              preserved=$((preserved + 1))
            fi
          done < <(git for-each-ref --format='%(refname:short)' refs/remotes/origin | sort)

          echo "Deleted merged branches: $deleted"
          echo "Preserved unmerged branches: $preserved"
