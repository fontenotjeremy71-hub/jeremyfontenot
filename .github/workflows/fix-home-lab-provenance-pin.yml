name: Fix Home Lab provenance pin

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Correct Home Lab current-portfolio source commit
        shell: bash
        run: |
          set -euo pipefail
          file='content/home-lab/evidence-organization.json'
          old='9d694d103875ed037eab6b5409e551ce14883a3c'
          new='cf7180c1b736ff69197efc4d732fc66ab6a34cab'
          grep -q "$old" "$file"
          git show "$new:evidence-library/projects/on-prem-home-lab/macos-active-directory-integration/MACVM01-AD-computer-object-public.txt" >/dev/null
          sed -i "s/$old/$new/g" "$file"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$file"
          git commit -m 'Fix Home Lab current-portfolio provenance pin'
          git push origin HEAD:main
