name: Finalize PR 78 review fixes

on:
  push:
    branches:
      - phase-3b-ad-service-desk-delegation-catalog

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Commit source-level review fixes
        id: source
        shell: bash
        run: |
          if ! grep -q 'ad-service-desk-delegation/source-original/evidence-manifest.json' content/home-lab/source-manifest.json; then
            node <<'NODE'
            const fs = require('node:fs');
            const crypto = require('node:crypto');
            const base = 'evidence-library/projects/on-prem-home-lab/ad-service-desk-delegation';
            const originalDir = `${base}/source-original`;
            const names = ['README.md','validation-public.txt','evidence-manifest.json','index.html'];
            const task = 'Delegate and validate bounded Active Directory Service Desk rights for password reset, account unlock, forced password change, and membership changes to one approved group.';
            const skill = 'Scoped Active Directory identity and group-membership administration using least-privilege delegation.';

            const smPath = 'content/home-lab/source-manifest.json';
            const sm = JSON.parse(fs.readFileSync(smPath,'utf8'));
            const desired = [];
            for (const name of names) desired.push({path:`${base}/${name}`,collection:'ad-service-desk-delegation',reason:'Sanitized presentation derivative for validated least-privilege Active Directory Service Desk delegation.',technologyRelationships:['active-directory'],skill,task});
            for (const name of names) desired.push({path:`${originalDir}/${name}`,collection:'ad-service-desk-delegation-source-original',reason:'Byte-preserved first-capture source retained to preserve evidence and provenance for the sanitized presentation derivative.',technologyRelationships:['active-directory'],skill,task});
            const paths = new Set(desired.map(x=>x.path));
            sm.approvedIndividualFiles = (sm.approvedIndividualFiles || []).filter(x=>!paths.has(x.path));
            sm.approvedIndividualFiles.push(...desired);
            sm.reviewedExclusions = (sm.reviewedExclusions || []).filter(x=>!paths.has(x.path));
            fs.writeFileSync(smPath, JSON.stringify(sm,null,2)+'\n');

            const exPath = 'content/home-lab/sensitive-data-exceptions.json';
            const ex = JSON.parse(fs.readFileSync(exPath,'utf8'));
            ex.exceptions = (ex.exceptions || []).filter(x=>!String(x.id||'').startsWith('ad-delegation-standard-schema-'));
            const guid = /\b[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}\b/gi;
            for (const name of names) {
              const p = `${originalDir}/${name}`;
              const values = [...new Set(fs.readFileSync(p,'utf8').match(guid) || [])].sort();
              if (!values.length) continue;
              ex.exceptions.push({id:`ad-delegation-standard-schema-${name.replace(/[^a-z0-9]+/gi,'-').toLowerCase()}`,findingType:'tenant-or-object-identifier',valueFingerprints:values.map(v=>crypto.createHash('sha256').update(v).digest('hex')),reason:'Standard Microsoft Active Directory schema or extended-right GUIDs retained only in the byte-preserved first-capture evidence; these are not tenant-specific secrets.',scope:[p],reviewerNote:'Reviewed for PR 78 evidence-preservation remediation. Sanitized presentation derivatives are the preferred review path.'});
            }
            fs.writeFileSync(exPath, JSON.stringify(ex,null,2)+'\n');

            const genPath = 'scripts/build/generate-home-lab-evidence-organization.js';
            let gen = fs.readFileSync(genPath,'utf8');
            gen = gen.replace('skill: taxonomyRecord.skill, task: taxonomyRecord.task,','skill: manifestEntry.skill || taxonomyRecord.skill, task: manifestEntry.task || taxonomyRecord.task,');
            fs.writeFileSync(genPath,gen);

            const readmePath = `${base}/README.md`;
            let readme = fs.readFileSync(readmePath,'utf8');
            if (!readme.includes('## Preservation and derivative relationship')) readme = readme.replace('## Purpose\n','## Preservation and derivative relationship\n\nThis public file is a sanitized presentation derivative. The first captured evidence is retained byte-for-byte in [`source-original/`](./source-original/README.md). The derivative preserves the validated tasks, results, scope, and limitations while omitting unnecessary raw directory identifiers.\n\n## Purpose\n');
            fs.writeFileSync(readmePath,readme);

            const validationPath = `${base}/validation-public.txt`;
            let validation = fs.readFileSync(validationPath,'utf8');
            if (!validation.startsWith('SANITIZED PRESENTATION DERIVATIVE')) validation = 'SANITIZED PRESENTATION DERIVATIVE\nOriginal capture retained byte-for-byte at source-original/validation-public.txt\n\n' + validation;
            fs.writeFileSync(validationPath,validation);

            const manifestPath = `${base}/evidence-manifest.json`;
            const manifest = JSON.parse(fs.readFileSync(manifestPath,'utf8'));
            manifest.derivativeRelationship = {type:'sanitized-presentation-derivative',originalDirectory:`${originalDir}/`,originalSourceCommit:'06057b68753f2983f149851d1657bcf23dc65d36',preservation:'Original first-capture artifacts are retained byte-for-byte alongside this derivative.'};
            fs.writeFileSync(manifestPath,JSON.stringify(manifest,null,2)+'\n');

            const indexPath = `${base}/index.html`;
            let index = fs.readFileSync(indexPath,'utf8');
            if (!index.includes('Preserved original capture')) index = index.replace('<div class="actions"><a class="button primary" href="./validation-public.txt">Open validation summary</a><a class="button" href="./evidence-manifest.json">Open evidence manifest</a></div>','<div class="actions"><a class="button primary" href="./validation-public.txt">Open validation summary</a><a class="button" href="./evidence-manifest.json">Open evidence manifest</a><a class="button" href="./source-original/README.md">Preserved original capture</a></div>');
            fs.writeFileSync(indexPath,index);
            NODE
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Resolve PR 78 evidence preservation review"
            git push
            echo "committed=true" >> "$GITHUB_OUTPUT"
          else
            echo "committed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Pin source commit and regenerate
        if: steps.source.outputs.committed != 'true'
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const {execFileSync} = require('node:child_process');
          const p='content/home-lab/evidence-organization.json';
          const d=JSON.parse(fs.readFileSync(p,'utf8'));
          d.sources.currentPortfolio.commit=execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
          fs.writeFileSync(p,JSON.stringify(d,null,2)+'\n');
          NODE
          npm run build
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add -A
            git commit -m "Regenerate PR 78 evidence and relationship outputs"
            git push
          fi
