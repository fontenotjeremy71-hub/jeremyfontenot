name: Finalize PR 78 review fixes

on:
  push:
    branches:
      - phase-3b-ad-service-desk-delegation-catalog

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Commit source-level review fixes
        id: source
        shell: bash
        run: |
          if ! grep -q 'ad-service-desk-delegation/source-original/evidence-manifest.json' content/home-lab/source-manifest.json; then
            node scripts/maintenance/fix-pr78-review.js
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Resolve PR 78 evidence preservation review"
            git push
            echo "committed=true" >> "$GITHUB_OUTPUT"
          else
            echo "committed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Pin source commit
        if: steps.source.outputs.committed != 'true'
        shell: bash
        run: |
          node -e "const fs=require('node:fs'),cp=require('node:child_process');const p='content/home-lab/evidence-organization.json';const d=JSON.parse(fs.readFileSync(p,'utf8'));d.sources.currentPortfolio.commit=cp.execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();fs.writeFileSync(p,JSON.stringify(d,null,2)+'\n');"

      - name: Regenerate authoritative outputs
        if: steps.source.outputs.committed != 'true'
        run: npm run build

      - name: Validate and commit generated outputs
        if: steps.source.outputs.committed != 'true'
        shell: bash
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add -A
            git commit -m "Regenerate PR 78 evidence and relationship outputs"
            git push
          fi

# Triggered after preserved-source catalog entries were committed.
