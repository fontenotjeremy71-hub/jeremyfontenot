name: Regenerate AD delegation evidence outputs

on:
  push:
    branches:
      - phase-3b-ad-service-desk-delegation-catalog

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Regenerate portfolio outputs
        id: build
        shell: bash
        run: |
          set +e
          npm run build 2>&1 | tee /tmp/ad-delegation-build.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit $code

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ad-delegation-build-log
          path: /tmp/ad-delegation-build.log
          if-no-files-found: warn

      - name: Validate generated diff
        run: git diff --check

      - name: Commit regenerated outputs
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Regenerate AD delegation evidence catalog and claim map"
          git push
