name: Regenerate AD delegation evidence outputs

on:
  push:
    branches:
      - phase-3b-ad-service-desk-delegation-catalog

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pin AD delegation catalog relationships
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const manifestPath = 'content/home-lab/source-manifest.json';
          const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
          const paths = [
            'evidence-library/projects/on-prem-home-lab/ad-service-desk-delegation/README.md',
            'evidence-library/projects/on-prem-home-lab/ad-service-desk-delegation/validation-public.txt',
            'evidence-library/projects/on-prem-home-lab/ad-service-desk-delegation/evidence-manifest.json',
            'evidence-library/projects/on-prem-home-lab/ad-service-desk-delegation/index.html'
          ];
          const pinned = new Set(paths);
          manifest.approvedIndividualFiles = (manifest.approvedIndividualFiles || []).filter((item) => !pinned.has(item.path));
          for (const path of paths) {
            manifest.approvedIndividualFiles.push({
              path,
              collection: 'ad-service-desk-delegation',
              reason: 'Sanitized public evidence for validated least-privilege Active Directory Service Desk delegation.',
              technologyRelationships: ['active-directory']
            });
          }
          fs.writeFileSync(manifestPath, JSON.stringify(manifest, null, 2) + '\n');
          NODE

      - name: Regenerate portfolio outputs
        id: build
        shell: bash
        run: |
          set +e
          npm run build 2>&1 | tee /tmp/ad-delegation-build.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit $code

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ad-delegation-build-log
          path: /tmp/ad-delegation-build.log
          if-no-files-found: warn

      - name: Validate generated diff
        run: git diff --check

      - name: Commit regenerated outputs
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Catalog AD delegation evidence under Active Directory"
          git push
