name: Address PR 78 review findings

on:
  push:
    branches:
      - phase-3b-ad-service-desk-delegation-catalog

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare review fixes
        id: prepare
        shell: bash
        run: |
          if [ ! -f evidence-library/projects/on-prem-home-lab/ad-service-desk-delegation/source-original/evidence-manifest.json ]; then
            node <<'NODE'
            const fs = require('node:fs');
            const path = require('node:path');
            const crypto = require('node:crypto');
            const {execFileSync} = require('node:child_process');

            const sourceCommit = '06057b68753f2983f149851d1657bcf23dc65d36';
            const base = 'evidence-library/projects/on-prem-home-lab/ad-service-desk-delegation';
            const originals = ['README.md','validation-public.txt','evidence-manifest.json','index.html'];
            const originalDir = `${base}/source-original`;
            fs.mkdirSync(originalDir, {recursive:true});
            for (const name of originals) {
              const sourcePath = `${base}/${name}`;
              const bytes = execFileSync('git', ['show', `${sourceCommit}:${sourcePath}`]);
              fs.writeFileSync(`${originalDir}/${name}`, bytes);
            }

            const readmePath = `${base}/README.md`;
            let readme = fs.readFileSync(readmePath, 'utf8');
            if (!readme.includes('## Preservation and derivative relationship')) {
              readme = readme.replace('## Purpose\n', `## Preservation and derivative relationship\n\nThis file is a sanitized presentation derivative. The first captured version is retained byte-for-byte under [source-original](./source-original/README.md) from repository commit \`${sourceCommit}\`. Public presentation removes raw directory object/schema identifiers while preserving the validated tasks, results, scope, and limitations.\n\n## Purpose\n`);
              fs.writeFileSync(readmePath, readme);
            }

            const validationPath = `${base}/validation-public.txt`;
            let validation = fs.readFileSync(validationPath, 'utf8');
            if (!validation.startsWith('SANITIZED PRESENTATION DERIVATIVE')) {
              validation = `SANITIZED PRESENTATION DERIVATIVE\nOriginal capture preserved at: source-original/validation-public.txt\nOriginal source commit: ${sourceCommit}\n\n${validation}`;
              fs.writeFileSync(validationPath, validation);
            }

            const manifestPath = `${base}/evidence-manifest.json`;
            const evidenceManifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
            evidenceManifest.derivativeRelationship = {
              type: 'sanitized-presentation-derivative',
              originalDirectory: `${originalDir}/`,
              originalSourceCommit: sourceCommit,
              preservation: 'Original first-capture artifacts retained byte-for-byte; this public presentation removes unnecessary raw directory identifiers.'
            };
            fs.writeFileSync(manifestPath, JSON.stringify(evidenceManifest, null, 2) + '\n');

            const indexPath = `${base}/index.html`;
            let index = fs.readFileSync(indexPath, 'utf8');
            if (!index.includes('Preserved original capture')) {
              index = index.replace('<div class="actions"><a class="button primary" href="./validation-public.txt">Open validation summary</a><a class="button" href="./evidence-manifest.json">Open evidence manifest</a></div>', '<div class="actions"><a class="button primary" href="./validation-public.txt">Open validation summary</a><a class="button" href="./evidence-manifest.json">Open evidence manifest</a><a class="button" href="./source-original/README.md">Preserved original capture</a></div>');
              fs.writeFileSync(indexPath, index);
            }

            const task = 'Delegate and validate bounded Active Directory Service Desk rights for password reset, account unlock, forced password change, and membership changes to one approved group.';
            const skill = 'Scoped Active Directory identity and group-membership administration using least-privilege delegation.';
            const sourceManifestPath = 'content/home-lab/source-manifest.json';
            const sourceManifest = JSON.parse(fs.readFileSync(sourceManifestPath, 'utf8'));
            const entries = [];
            for (const name of originals) entries.push({path:`${base}/${name}`, collection:'ad-service-desk-delegation', reason:'Sanitized public derivative for validated least-privilege Active Directory Service Desk delegation.', technologyRelationships:['active-directory'], skill, task});
            for (const name of originals) entries.push({path:`${originalDir}/${name}`, collection:'ad-service-desk-delegation-source-original', reason:'Byte-preserved first-capture source retained for evidence preservation and derivative provenance.', technologyRelationships:['active-directory'], skill, task});
            const paths = new Set(entries.map(e => e.path));
            sourceManifest.approvedIndividualFiles = (sourceManifest.approvedIndividualFiles || []).filter(e => !paths.has(e.path));
            sourceManifest.approvedIndividualFiles.push(...entries);
            sourceManifest.reviewedExclusions = (sourceManifest.reviewedExclusions || []).filter(e => !paths.has(e.path));
            fs.writeFileSync(sourceManifestPath, JSON.stringify(sourceManifest, null, 2) + '\n');

            const exceptionPath = 'content/home-lab/sensitive-data-exceptions.json';
            const exceptions = JSON.parse(fs.readFileSync(exceptionPath, 'utf8'));
            exceptions.exceptions = (exceptions.exceptions || []).filter(e => !String(e.id || '').startsWith('ad-delegation-standard-schema-'));
            const guidPattern = /\b[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}\b/gi;
            for (const name of originals) {
              const p = `${originalDir}/${name}`;
              const text = fs.readFileSync(p, 'utf8');
              const values = [...new Set(text.match(guidPattern) || [])].sort();
              if (!values.length) continue;
              exceptions.exceptions.push({
                id: `ad-delegation-standard-schema-${name.replace(/[^a-z0-9]+/gi,'-').toLowerCase()}`,
                findingType: 'tenant-or-object-identifier',
                valueFingerprints: values.map(v => crypto.createHash('sha256').update(v).digest('hex')),
                reason: 'Standard Microsoft Active Directory schema or extended-right GUIDs are retained only in the byte-preserved first-capture artifact to satisfy evidence-preservation requirements; they are not tenant-specific secrets.',
                scope: [p],
                reviewerNote: 'Reviewed for PR 78 preservation remediation. Sanitized presentation derivatives remain the preferred public review path.'
              });
            }
            fs.writeFileSync(exceptionPath, JSON.stringify(exceptions, null, 2) + '\n');

            const generatorPath = 'scripts/build/generate-home-lab-evidence-organization.js';
            let generator = fs.readFileSync(generatorPath, 'utf8');
            const oldGenerator = 'skill: taxonomyRecord.skill, task: taxonomyRecord.task,';
            const newGenerator = 'skill: manifestEntry.skill || taxonomyRecord.skill, task: manifestEntry.task || taxonomyRecord.task,';
            if (generator.includes(oldGenerator)) generator = generator.replace(oldGenerator, newGenerator);
            else if (!generator.includes(newGenerator)) throw new Error('Could not locate Home Lab skill/task assignment for override support.');
            fs.writeFileSync(generatorPath, generator);

            const mappingPath = 'scripts/lib/evidence-skill-mapping.js';
            let mapping = fs.readFileSync(mappingPath, 'utf8');
            if (!mapping.includes('collectionRelationshipOverrides')) {
              mapping = mapping.replace('};\n\nfunction normalizeEvidenceType', `};\n\nconst collectionRelationshipOverrides = {\n  "ad-service-desk-delegation": {skillIds: ["identity-administration"], systems: ["active-directory"]},\n  "ad-service-desk-delegation-source-original": {skillIds: ["identity-administration"], systems: ["active-directory"]},\n};\n\nfunction normalizeEvidenceType`);
              mapping = mapping.replace('function systemsFor(record) {\n  const haystack', 'function systemsFor(record) {\n  const override = collectionRelationshipOverrides[record.collection];\n  if (override?.systems) return [...override.systems];\n  const haystack');
              mapping = mapping.replace('function skillIdsFor(record) {\n  const base', 'function skillIdsFor(record) {\n  const override = collectionRelationshipOverrides[record.collection];\n  if (override?.skillIds) return [...override.skillIds].sort();\n  const base');
            }
            fs.writeFileSync(mappingPath, mapping);
            NODE

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Address PR 78 evidence preservation and mapping review"
            git push
            echo "prepared=true" >> "$GITHUB_OUTPUT"
          else
            echo "prepared=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Stop after source preparation
        if: steps.prepare.outputs.prepared == 'true'
        run: echo "Source remediation committed; next push run will regenerate authoritative outputs."

      - name: Pin current source commit
        if: steps.prepare.outputs.prepared != 'true'
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const {execFileSync} = require('node:child_process');
          const p = 'content/home-lab/evidence-organization.json';
          const doc = JSON.parse(fs.readFileSync(p, 'utf8'));
          doc.sources.currentPortfolio.commit = execFileSync('git', ['rev-parse','HEAD'], {encoding:'utf8'}).trim();
          fs.writeFileSync(p, JSON.stringify(doc, null, 2) + '\n');
          NODE

      - name: Regenerate authoritative outputs
        if: steps.prepare.outputs.prepared != 'true'
        run: npm run build

      - name: Validate generated diff
        if: steps.prepare.outputs.prepared != 'true'
        run: git diff --check

      - name: Commit regenerated outputs
        if: steps.prepare.outputs.prepared != 'true'
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Regenerate PR 78 evidence catalog and relationship maps"
          git push
