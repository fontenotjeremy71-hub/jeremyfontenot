name: Production Static Validation
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Wait for matching Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os, json, time, urllib.request
          url = 'https://api.github.com/repos/' + os.environ['REPO'] + '/actions/runs?head_sha=' + os.environ['SHA'] + '&per_page=100'
          for attempt in range(90):
              req = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(req) as response:
                  runs = json.load(response)['workflow_runs']
              pages = [r for r in runs if r['name'] == 'pages build and deployment']
              if pages and pages[0]['status'] == 'completed':
                  if pages[0]['conclusion'] != 'success':
                      raise SystemExit('Pages deployment failed: ' + str(pages[0]['conclusion']))
                  break
              time.sleep(10)
          else:
              raise SystemExit('Timed out waiting for matching Pages deployment')
          PY
      - name: Verify deployed routes, downloads and exact release bytes
        run: python scripts/validation/validate-static-release.py --base-url https://jeremyfontenot.online
