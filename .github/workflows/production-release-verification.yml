name: Production Release Verification

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/production-release-verification.yml
      - scripts/validation/verify-production-release.js
      - docs/portfolio-migration-phase-ledger.md
  workflow_dispatch:
    inputs:
      target_sha:
        description: Full main-branch commit SHA to verify
        required: false
        type: string

permissions:
  contents: read

jobs:
  verify-production-release:
    name: Verify main workflows and live site
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify exact main workflows and production release
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.target_sha || 'b67f214fe4bcd80fcf03d36a22350fc60793c8ba' }}
          REPORT_PATH: artifacts/release/final-live-verification.json
        run: |
          mkdir -p artifacts/release
          : > artifacts/release/verifier.log
          verifier_status=1
          for attempt in 1 2 3; do
            echo "Production verification attempt ${attempt} of 3" | tee -a artifacts/release/verifier.log
            set +e
            node scripts/validation/verify-production-release.js 2>&1 | tee -a artifacts/release/verifier.log
            verifier_status=${PIPESTATUS[0]}
            set -e
            if [[ "$verifier_status" -eq 0 ]]; then
              break
            fi
            if [[ "$attempt" -lt 3 ]]; then
              sleep $((attempt * 20))
            fi
          done
          if [[ ! -f "$REPORT_PATH" ]]; then
            node -e "const fs=require('node:fs'); const log=fs.readFileSync('artifacts/release/verifier.log','utf8'); fs.writeFileSync(process.env.REPORT_PATH, JSON.stringify({status:'NOT_READY',targetSha:process.env.TARGET_SHA,error:log.trim()},null,2)+'\\n');"
          fi
          exit "$verifier_status"

      - name: Publish verification summary
        if: always()
        shell: bash
        run: |
          if [[ -f artifacts/release/final-live-verification.json ]]; then
            {
              echo '## Production release verification'
              echo
              echo '```json'
              cat artifacts/release/final-live-verification.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload production verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-release-verification
          path: artifacts/release
          if-no-files-found: error
          retention-days: 30
