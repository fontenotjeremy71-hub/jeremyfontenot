name: Regenerate audit skill-map outputs

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Regenerate canonical skill-map outputs
        run: npm run build:skill-map

      - name: Commit regenerated outputs when required
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          if git diff --quiet -- \
            assets/data/evidence-skill-map.json \
            systems-skills/evidence-map.html \
            evidence/claim-map.html \
            content/site/generated-skill-map-hashes.json; then
            echo "Generated outputs are already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            assets/data/evidence-skill-map.json \
            systems-skills/evidence-map.html \
            evidence/claim-map.html \
            content/site/generated-skill-map-hashes.json
          git commit -m "build: refresh normalized skill-map outputs"
          git push origin "HEAD:${HEAD_BRANCH}"
