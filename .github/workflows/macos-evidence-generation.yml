name: Generate MACVM01 evidence outputs

on:
  push:
    branches:
      - feat/macos-home-lab-evidence
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: macos-evidence-generation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/macos-home-lab-evidence
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate evidence outputs
        id: generate
        shell: bash
        run: |
          set +e
          mkdir -p artifacts/validation
          npm run build:home-lab 2>&1 | tee artifacts/validation/macos-evidence-generation.log
          exit_code=${PIPESTATUS[0]}
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload generation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-evidence-generation
          path: artifacts/validation/macos-evidence-generation.log
          if-no-files-found: error
          retention-days: 14

      - name: Commit deterministic outputs
        id: commit_outputs
        if: steps.generate.outputs.exit_code == '0'
        shell: bash
        run: |
          set +e
          {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- \
              assets/data/home-lab-evidence-catalog.json \
              home-lab/evidence-catalog.html \
              home-lab/source-to-destination-matrix.csv \
              home-lab/duplicate-groups.json \
              home-lab/sensitive-data-review.json \
              home-lab/authoritative-source-decisions.json \
              active-directory-lab.html \
              infrastructure.html \
              network-segmentation.html \
              powershell-automation.html \
              content/home-lab/generated-output-hashes.json
            git status --short
            if git diff --cached --quiet; then
              echo "No generated output changes."
              exit 0
            fi
            git commit -m "build: publish MACVM01 Home Lab evidence"
            git push origin HEAD:feat/macos-home-lab-evidence
          } 2>&1 | tee artifacts/validation/macos-output-commit.log
          exit_code=${PIPESTATUS[0]}
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload commit diagnostics
        if: always() && steps.generate.outputs.exit_code == '0'
        uses: actions/upload-artifact@v4
        with:
          name: macos-output-commit
          path: artifacts/validation/macos-output-commit.log
          if-no-files-found: error
          retention-days: 14

      - name: Fail when generation or commit failed
        if: steps.generate.outputs.exit_code != '0' || steps.commit_outputs.outputs.exit_code != '0'
        run: exit 1
