name: Jekyll Migration Preview
on:
  pull_request:
    branches: [main]
    paths:
      - 'jekyll-pilot/**'
      - '.github/workflows/jekyll-migration-preview.yml'
  push:
    branches: ['feature/jekyll-migration-20261108']
    paths:
      - 'jekyll-pilot/**'
      - '.github/workflows/jekyll-migration-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pilot-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: jekyll-pilot
      - name: Generate shared-layout wrappers for the complete site
        run: python jekyll-pilot/tools/prepare_pages.py
      - name: Build managed Jekyll pages
        working-directory: jekyll-pilot
        run: bundle exec jekyll build --destination ../_jekyll-generated
      - name: Verify generated structured project directory
        run: |
          test -s _jekyll-generated/index.html
          test -s _jekyll-generated/about.html
          test -s _jekyll-generated/projects.html
          test "$(grep -o 'class="panel" data-category=' _jekyll-generated/projects.html | wc -l)" -eq 15
          grep -q '15 projects shown' _jekyll-generated/projects.html
      - name: Assemble complete static publication with original evidence
        run: python jekyll-pilot/tools/assemble_site.py
      - name: Verify public routes, evidence integrity, SEO and internal links
        run: python jekyll-pilot/tools/verify_site.py
      - name: Upload complete Jekyll publication for review
        uses: actions/upload-artifact@v4
        with:
          name: jekyll-complete-site-preview
          path: site-jekyll/
          if-no-files-found: error
          retention-days: 7
