name: Jekyll Migration Preview
on:
  pull_request:
    branches: [main]
    paths:
      - 'jekyll-pilot/**'
      - '.github/workflows/jekyll-migration-preview.yml'
  push:
    branches: ['feature/jekyll-migration-20261108']
    paths:
      - 'jekyll-pilot/**'
      - '.github/workflows/jekyll-migration-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pilot-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: jekyll-pilot
      - name: Build isolated Jekyll pilot
        working-directory: jekyll-pilot
        run: bundle exec jekyll build --destination ../_jekyll-preview
      - name: Verify migrated About page
        run: |
          test -s _jekyll-preview/about.html
          grep -q 'A support foundation' _jekyll-preview/about.html
          grep -q 'site-header' _jekyll-preview/about.html
      - name: Verify generated 15-project directory
        run: |
          test -s _jekyll-preview/projects.html
          test "$(grep -o 'class="panel" data-category=' _jekyll-preview/projects.html | wc -l)" -eq 15
          grep -q '15 projects shown' _jekyll-preview/projects.html
          grep -q 'project-15.html' _jekyll-preview/projects.html
      - name: Verify migrated case study pages and shared navigation
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          root = Path('_jekyll-preview')
          entries = sorted(Path('jekyll-pilot/_projects').glob('*.md'))
          assert len(entries) == 15, f'Expected 15 project records; got {len(entries)}'
          for entry in entries:
              match = re.search(r'^case_study_url: "([^"]+)"
        with:
          name: jekyll-pilot-preview
          path: _jekyll-preview/
, entry.read_text(encoding='utf-8'), re.M)
              assert match, f'Missing case_study_url: {entry}'
              page = root / match.group(1).lstrip('/')
              assert page.is_file(), f'Missing generated case study: {page}'
              html = page.read_text(encoding='utf-8')
              assert '<header class="site-header">' in html, f'Missing shared header: {page}'
              assert 'href="/projects.html"' in html, f'Broken nested navigation: {page}'
              assert f'href="https://jeremyfontenot.online{match.group(1)}"' in html, f'Incorrect canonical URL: {page}'
          print('All 15 case studies generated with shared layout and correct canonical URLs.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: jekyll-pilot-preview
          path: _jekyll-preview/
