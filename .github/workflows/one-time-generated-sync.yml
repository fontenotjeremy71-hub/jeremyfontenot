name: One-time Generated Catalog Sync

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    if: github.event.head_commit.message == 'chore: sync generated catalog outputs'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Regenerate portfolio outputs
        run: npm run build

      - name: Commit generated catalog outputs
        shell: bash
        run: |
          set -euo pipefail
          git add \
            evidence-library/preserved-sharepoint/index.html \
            evidence-library/integrity/evidence-hashes.json \
            content/microsoft-365/generated-output-hashes.json
          if git diff --cached --quiet; then
            echo 'Generated outputs are already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: synchronize generated SharePoint catalog outputs'
          git push origin HEAD:main
