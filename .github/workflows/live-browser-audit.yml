name: Live Site Browser Audit

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: live-browser-audit-main
  cancel-in-progress: true

jobs:
  audit-live-site:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Wait for matching GitHub Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Waiting for Pages deployment for $SHA"
          for attempt in $(seq 1 90); do
            payload="$(curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPO/actions/runs?head_sha=$SHA&per_page=100")"
            result="$(printf '%s' "$payload" | jq -r '[.workflow_runs[] | select(.name == "pages build and deployment")][0] | if . == null then "missing" else (.status + ":" + (.conclusion // "")) end')"
            echo "Attempt $attempt: $result"
            if [[ "$result" == "completed:success" ]]; then
              exit 0
            fi
            if [[ "$result" == completed:* && "$result" != "completed:success" ]]; then
              echo "Matching Pages deployment failed: $result" >&2
              exit 1
            fi
            sleep 10
          done
          echo "Timed out waiting for the matching Pages deployment." >&2
          exit 1

      - name: Install Playwright
        run: |
          python -m pip install --disable-pip-version-check playwright==1.55.0
          python -m playwright install --with-deps chromium

      - name: Run live Chromium click audit
        env:
          PORTFOLIO_BASE_URL: https://jeremyfontenot.online
          PORTFOLIO_BROWSER_AUDIT_MAX_PAGES: '300'
          PORTFOLIO_BROWSER_NAV_TIMEOUT_MS: '20000'
        run: python scripts/audits/live-browser-audit.py

      - name: Upload live browser audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-browser-audit-${{ github.sha }}
          path: artifacts/live-browser-audit.json
          if-no-files-found: warn
