name: Repository Validation
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate static pages and original evidence integrity
        run: python scripts/validation/validate-static-release.py
      - name: Check whitespace
        run: git diff --check
      - name: Verify current production responses for verification-only fixes
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'fix/static-production-')
        run: python scripts/validation/validate-static-release.py --base-url https://jeremyfontenot.online
