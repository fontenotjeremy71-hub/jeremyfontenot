name: Portfolio Checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: portfolio-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate portfolio
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Validate HTML
        shell: pwsh
        run: .\scripts\validation\validate-html.ps1

      - name: Validate accessibility basics
        shell: pwsh
        run: .\scripts\validation\validate-accessibility.ps1

      - name: Validate internal links
        shell: pwsh
        run: .\scripts\validation\validate-links.ps1

      - name: Validate SEO metadata
        shell: pwsh
        run: .\scripts\validation\validate-seo.ps1

      - name: Validate sitemap
        shell: pwsh
        run: .\scripts\validation\validate-sitemap.ps1
