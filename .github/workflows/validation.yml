name: Repository Validation
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate static pages and original evidence integrity
        run: python scripts/validation/validate-static-release.py
      - name: Validate Project 14 screenshot integrity and gallery
        run: python scripts/validation/validate-project14-evidence.py
      - name: Validate responsive pages and actual PNG rendering in Chrome
        run: python scripts/validation/validate-project14-browser.py --output browser-review
      - name: Retain responsive visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project14-browser-review
          path: browser-review/
      - name: Audit every linked route, redirect, visual layout and footer
        run: python scripts/validation/validate-visual-site.py --output visual-site-review
      - name: Retain complete site visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: complete-site-visual-review
          path: visual-site-review/
      - name: Check whitespace
        run: git diff --check
      - name: Verify current production responses for verification-only fixes
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'fix/static-production-')
        run: python scripts/validation/validate-static-release.py --base-url https://jeremyfontenot.online
