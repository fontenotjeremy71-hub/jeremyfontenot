name: Production Website Audit

on:
  workflow_dispatch:
  schedule:
    - cron: '17 12 * * *'

permissions:
  contents: read

concurrency:
  group: production-website-audit
  cancel-in-progress: false

jobs:
  production-audit:
    name: Live links, assets and responsive browser audit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out published source
        uses: actions/checkout@v4
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify installed Chrome
        run: |
          command -v google-chrome || command -v chromium || command -v chromium-browser
      - name: Validate production HTML, links and asset bytes
        run: python scripts/validation/validate-static-release.py --base-url https://jeremyfontenot.online
      - name: Audit live production browser at mobile, tablet and desktop widths
        run: python scripts/validation/validate-visual-site.py --base-url https://jeremyfontenot.online --output production-browser-review
      - name: Upload production audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-browser-review
          path: production-browser-review/
          if-no-files-found: warn
          retention-days: 14
